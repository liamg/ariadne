name: sprt-gate

on:
  pull_request:
    # "edited" matters here - ticking the box by hand edits the body, and the
    # bench workflow edits it too. Both must re-evaluate the gate.
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

concurrency:
  group: sprt-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: sprt verified
    runs-on: ubuntu-latest
    steps:
      - name: Require SPRT checkbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh pr view "${PR}" --json body --jq .body > "${RUNNER_TEMP}/body.md"

          python3 - "${RUNNER_TEMP}/body.md" <<'PY'
          import re
          import sys

          LINE = re.compile(r"^\s*[-*]\s*\[([ xX])\]\s*SPRT verified\b")

          with open(sys.argv[1], encoding="utf-8") as fh:
              lines = fh.read().splitlines()

          for line in lines:
              m = LINE.match(line)
              if not m:
                  continue
              if m.group(1) in ("x", "X"):
                  print(f"SPRT verified: {line.strip()}")
                  sys.exit(0)
              print("::error::SPRT has not been verified for this change.")
              print(
                  "The bench node count differs from the target branch, so the "
                  "search behaves differently. Run SPRT, record the result in "
                  "testing/results.md, then tick the box in the PR description."
              )
              sys.exit(1)

          print("::error::No 'SPRT verified' checkbox found in the PR description.")
          print("Restore it from .github/pull_request_template.md.")
          sys.exit(1)
          PY
